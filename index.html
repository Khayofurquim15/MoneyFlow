<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoneyFlow</title>
    <link rel="stylesheet" href="estilos/mobile.css">
    <link rel="stylesheet" href="estilos/desktop.css" media="screen and (min-width:760px)">
    <script src="https://kit.fontawesome.com/82590b91d6.js" crossorigin="anonymous"></script>
</head>
<body>

        <header>
            <h1>MoneyFlow <i class="fa-solid fa-money-bill-wave"></i> </h1>
            <menu>
                <a href="#">Minha Conta</a>
                <a href="#">Contato</a>
                <a href="#">Saiba Mais</a>
                <a href="#">Ajuda</a>
            </menu>

        </header>

        <main>     
            
            <section class="info">

                <div class="bloco-pessoa">
                    <h1>Olá, Usuario <i class="fa-solid fa-circle-user"></i> </h1>
                </div>
                <p>VISÃO GERAL</p>

                <div class="saldo" >

                    <div class="bloco-saldo" >
                        <p>Saldo total</p>
                        <h2 id="saldoTotal">R$ 240.700,00</h2>
                    </div>

                    <div class="bloco-saldo">
                        <p >Receitas totais</p>
                        <h2 id="receitaTotal">R$ 3.00,00</h2>
                    </div>

                    <div class="bloco-saldo" id="despesaTotal" >
                        <p>Despesas totais</p>
                        <h2 id="despesaTotal" >R$ 1.680,90</h2>
                    </div>

                </div>

            </section><!-- FIM DO INFO -->

            <section class="movimentos">

                <h2>Suas Movimentações <i class="fa-solid fa-truck-fast"></i> </h2> 
                <ul id="listaMov" >
                    <p>Nenhuma Movimentação...</p>
                </ul>

            </section>

            <section class="criar-movimento"> 

                <h2>Nova Movimentação <i class="fa-solid fa-trowel-bricks"></i> </h2>

                <form autocomplete="on" id="formMov" >

                    <div class="bloco-form" id="bloco-nome" >
                        <label for="nomeMov">Nome </label>
                        <input type="text" id="nomeMov" placeholder="Nome da Movimentação" required minlength="4" maxlength="12" >
                    </div>

                    <div class="bloco-form" id="bloco-valor" >
                        <label for="valorMov">Valor </label>
                        <input type="number" name="valorM" id="valorMov" required placeholder="000,00">
                    </div>

                    <div class="bloco-form" id="categorias" >
                        <label for="cateMov">Categoria </label>
                        <p>-</p>
                        <select name="categoria" id="cateMov">
                            <option value="outro" >Outro</option>
                            <option value="alimento" >Alimento</option>
                            <option value="energia" >Energia</option>
                            <option value="salario" >Salario</option>
                            <option value="extra" >Extra</option>
                        </select>
                    </div>

                    <div class="bloco-form" id="tipo" >

                        <div class="bloco-receita">
                            <label for="receita">Receita</label>
                            <input type="radio" name="tipos" id="receita" value="receita" checked >      
                        </div>

                        <div class="bloco-despesa" >
                            <label for="despesa">Despesa</label>
                            <input type="radio" name="tipos" id="despesa" value="despesa">
                        </div>

                    </div>

                    <button type="submit" id="btnCriarMov">+ Adicionar Movimentação</button>

                </form>

            </section> <!-- FIM CRIAR MOVIMENTO -->

        </main>

        <footer>
            <h2>MoneyFlow</h2>
            <p>O seu gerenciador financeiro pessoal.<p>
        </footer>

    <script src="script.js"></script>
</body>
</html>
